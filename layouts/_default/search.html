{{ define "main" }}
  <header class="page-header"><h1>{{ .Title }}</h1>{{ with .Content }}<div class="content">{{ . }}</div>{{ end }}</header>
  <label class="search-label" for="site-search">{{ .Params.placeholder | default "記事を検索" }}</label>
  <input id="site-search" class="search-input" type="search" autocomplete="off" placeholder="{{ .Params.placeholder | default "記事を検索" }}">
  <p id="search-status" class="post-meta" aria-live="polite"></p>
  <ul id="search-results" class="search-results"></ul>
  {{ $opts := dict "minify" true "targetPath" "js/search.js" }}
  {{ with resources.Get "js/search.js" }}{{ $script := . | js.Build $opts | fingerprint }}
    <script defer src="{{ $script.RelPermalink }}" integrity="{{ $script.Data.Integrity }}" data-index="{{ "index.json" | relURL }}" data-results-label="{{ i18n "searchResults" | default "件の記事が見つかりました" }}" data-empty-label="{{ i18n "searchEmpty" | default "記事が見つかりませんでした。" }}"></script>
  {{ end }}
{{ end }}
