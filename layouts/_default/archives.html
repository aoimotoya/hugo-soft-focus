{{ define "main" }}
  <header class="page-header"><h1>{{ .Title }}</h1>{{ with .Content }}<div class="content">{{ . }}</div>{{ end }}</header>
  {{ range .Site.RegularPages.GroupByDate "2006" }}
    <section class="archive-year"><h2>{{ .Key }}</h2>
      <ul class="archive-list">
        {{ range .Pages }}<li><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "01-02" }}</time><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></li>{{ end }}
      </ul>
    </section>
  {{ end }}
{{ end }}
