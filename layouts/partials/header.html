<header class="site-header">
  <a class="site-title" href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a>
  {{ with site.Menus.main }}
    <nav class="site-nav" aria-label="{{ i18n "mainNavigation" | default "メインナビゲーション" }}">
      {{ range . }}
        <a href="{{ .URL | relURL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{ end }}
    </nav>
  {{ end }}
</header>
